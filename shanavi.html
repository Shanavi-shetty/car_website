<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            width: 100%;
            height: 100vh;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        span{
            color:#222;
            display: inline;
            text-decoration: under;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-size: 22px;
            transform: rotate(100%);
            /* transform: rotate(360deg); */
            animation: animate 4s linear infinite;
        }
        @keyframes animate{
            0%{
                transform: rotate(100%) scale(0);
                /* transform: rotate(360deg) scale(0); */
            }
            50%{
                transform: rotateX(0deg) scale(1);
            }
            100%{
                transform: rotate(0deg) scale(0);
            }
        }
    </style>
</head>
<body>
    
    <div class="container">
        <!-- <span><img src="back.jpg" alt=""></span>
        <span><img src="background.jpg" alt=""></span>
        <span><img src="logo.jpg" alt=""></span>
        <span><img src="logo1.jpg" alt=""></span> -->
        <span><img src="th (1).jpg" alt=""></span>
        <span><img src="th (2).jpg" alt=""></span>
        <span><img src="th.jpg" alt=""></span>
    </div>
    
</body>
</html>
